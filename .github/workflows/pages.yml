# GitHub Pages telepítés – fehérlistával.
# Csak a név szerint felsorolt oldalfájlok kerülnek ki, így a munkafájlok
# (jegyzetek, .md fájlok, forrásanyagok) akkor sem mennek élesbe, ha véletlenül
# bekerülnek a repóba. Új fájl vagy mappa esetén ezt a listát is bővíteni kell!
#
# Beállítás egyszer: GitHub repó → Settings → Pages → Source: „GitHub Actions”.

name: Oldal élesítése

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Oldalfájlok összegyűjtése (fehérlista)
        run: |
          mkdir _site
          cp index.html impresszum.html adatvedelem.html sutik.html 404.html favicon.svg robots.txt sitemap.xml _site/
          cp -r css js fonts img _site/
          # Saját domain esetén
          if [ -f CNAME ]; then cp CNAME _site/; fi
          echo "Kikerülő fájlok:" && find _site -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
